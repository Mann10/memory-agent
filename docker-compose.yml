services:
  redis-database:
    container_name: redis-database
    hostname: redis-database
    image: redis:8.0-rc1
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping | grep PONG" ]
      interval: 10s
      retries: 5
      start_period: 5s
      timeout: 5s

  postgres:
    image: pgvector/pgvector:pg16
    container_name: agent-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agent_memory
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d agent_memory" ]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    container_name: agent-nats
    hostname: nats
    ports:
      - "4222:4222" # client connections
      - "8222:8222" # HTTP monitoring  →  http://localhost:8222
    command: [ "--jetstream", "--store_dir=/data", "--http_port=8222" ]
    volumes:
      - nats_data:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8222/healthz | grep -q ok" ]
      interval: 10s
      retries: 5
      start_period: 5s
      timeout: 5s

volumes:
  postgres_data:
  nats_data:
